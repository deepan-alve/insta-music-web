server {
  listen 80;
  root /usr/share/nginx/html;
  # /privacy serves privacy.html
  location / { try_files $uri $uri.html $uri/ =404; }
  error_page 404 /404.html;
  location ~* \.(woff2|webp|png|css|js)$ { add_header Cache-Control "public, max-age=604800"; }
  # no-transform stops Cloudflare from injecting its Web Analytics beacon. The privacy page promises no analytics.
  add_header Cache-Control "no-transform" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  # Scripts and frames from this site only: the demo feed and its framed popup.
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; frame-src 'self'; frame-ancestors 'self'; base-uri 'none'; form-action 'none'" always;
}
