server {
  listen 80;
  root /usr/share/nginx/html;
  # /privacy serves privacy.html
  location / { try_files $uri $uri.html $uri/ =404; }
  error_page 404 /404.html;
  location ~* \.(woff2|webp|png|css)$ { add_header Cache-Control "public, max-age=604800"; }
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'none'; frame-ancestors 'none'" always;
}
