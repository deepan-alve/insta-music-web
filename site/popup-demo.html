<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Postsound popup</title>
  <meta name="robots" content="noindex">
  <!-- The real popup stylesheet, so the site shows the popup people get. -->
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/popup.css">
  <link rel="stylesheet" href="/popup-demo.css">
</head>
<body>
  <header class="head">
    <img class="logo" src="/img/mark-96.png" alt="" width="20" height="20">
    <h1>Postsound</h1>
    <span class="ver">v1.1.0</span>
  </header>

  <section class="now" id="now" data-mode="blocked" aria-live="polite">
    <div class="art" id="art" aria-hidden="true">
      <svg class="icon" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    </div>
    <div class="meta">
      <span class="label"><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span><span id="label">Click the page to play</span></span>
      <span class="title" id="title">Late Light</span>
      <span class="artist" id="artist">Sunday Static</span>
    </div>
    <button class="action" id="action" type="button" aria-label="Play">
      <svg class="icon i-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>
      <svg class="icon i-play" viewBox="0 0 24 24" aria-hidden="true"><polygon points="7 4 20 12 7 20 7 4"/></svg>
      <svg class="icon i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></svg>
    </button>
  </section>

  <section class="settings" aria-label="Settings">
    <label class="row" for="sound">
      <span class="row-title">Play songs on photo posts</span>
      <input id="sound" class="switch" type="checkbox" role="switch" checked>
    </label>
    <div class="row">
      <svg class="icon vol-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><path d="M16 9a5 5 0 0 1 0 6"/></svg>
      <input id="volume" class="volume" type="range" min="0" max="100" step="1" value="80" aria-label="Music volume">
      <output id="volume-out" class="vol-out" for="volume">80%</output>
    </div>
  </section>

  <nav class="links" aria-label="Help and support">
    <a href="https://guestbook.deepanalve.dev/sign?product=postsound" target="_top" id="support-link">Buy me a sticker</a>
    <a href="#faq" data-top>Report a problem</a>
    <a href="#faq" data-top>About</a>
  </nav>
  <script src="/popup-demo.js"></script>
</body>
</html>
