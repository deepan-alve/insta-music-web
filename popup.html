<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Postsound</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <img class="logo" src="icons/icon-32.png" alt="" width="20" height="20">
    <h1>Postsound</h1>
    <span class="ver" id="version"></span>
  </header>

  <!-- Now playing. popup.js fills it from the Instagram tab. data-mode: off-site, empty, ready, playing, blocked -->
  <section class="now" id="now" data-mode="off-site" aria-live="polite">
    <div class="art" id="art" aria-hidden="true">
      <svg class="icon" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    </div>
    <div class="meta">
      <span class="label"><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span><span id="label">Not on Instagram</span></span>
      <span class="title" id="title">Open Instagram</span>
      <span class="artist" id="artist">Songs play on photo posts</span>
    </div>
    <button class="action" id="action" type="button" aria-label="Open Instagram">
      <svg class="icon i-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>
      <svg class="icon i-play" viewBox="0 0 24 24" aria-hidden="true"><polygon points="7 4 20 12 7 20 7 4"/></svg>
      <svg class="icon i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></svg>
    </button>
  </section>

  <section class="settings" aria-label="Settings">
    <label class="row" for="sound">
      <span class="row-title">Play songs on photo posts</span>
      <input id="sound" class="switch" type="checkbox" role="switch" checked>
    </label>
    <div class="row">
      <svg class="icon vol-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><path d="M16 9a5 5 0 0 1 0 6"/></svg>
      <input id="volume" class="volume" type="range" min="0" max="100" step="1" value="100" aria-label="Music volume">
      <output id="volume-out" class="vol-out" for="volume">100%</output>
    </div>
  </section>

  <nav class="links" aria-label="Help and support">
    <a href="#" data-page="about.html#support" id="support-link">Buy me a sticker</a>
    <a href="#" data-page="about.html#report">Report a problem</a>
    <a href="#" data-page="about.html">About</a>
  </nav>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
