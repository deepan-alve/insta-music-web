<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Postsound</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <img class="logo" src="icons/icon-48.png" alt="" width="32" height="32">
    <div>
      <h1>Postsound</h1>
      <p class="sub">Music for Instagram photos</p>
    </div>
  </header>

  <label class="row" for="sound">
    <span class="row-text">
      <span class="row-title">Play songs on photo posts</span>
      <span class="row-hint" id="hint">On instagram.com, in the feed, on profiles and in posts.</span>
    </span>
    <input id="sound" class="switch" type="checkbox" role="switch" checked>
  </label>

  <p class="foot">Reels keep their own sound. Your browser may wait for one click on the page before it plays audio.</p>

  <script src="popup.js"></script>
</body>
</html>
